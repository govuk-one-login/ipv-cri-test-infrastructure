name: Unit tests (Test Resources)

on:
  workflow_call:
    inputs:
      coverage-report: { type: boolean, required: false, default: false }
      coverage-artifact:
        { type: string, required: false, default: coverage-test-resources }
    outputs:
      coverage-artifact:
        value: ${{ inputs.coverage-artifact }}
    secrets:
      npm-token: { required: true }

concurrency:
  group: unit-tests-test-resources-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  run-unit-tests:
    name: Test Resources
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          cache-dependency-path: ./package.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Run tests
        run: npm run test:coverage -- --config vitest.config.ts

      - name: Archive coverage results
        if: ${{ inputs.coverage-report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: coverage/lcov.info
          retention-days: 3
